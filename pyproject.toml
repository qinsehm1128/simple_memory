[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-memory"
version = "0.2.0"
description = "A memory MCP server using SatoriDB for storage and vector search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "memory", "satoridb", "vector-database", "ai", "remark"]
authors = [
    { name = "Simple Memory Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "flask>=3.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "ollama>=0.3.0",
    "python-dotenv>=1.0.0",
    "uuid6>=2024.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
simple-memory = "simple_memory.cli:main"
simple-memory-mcp = "simple_memory.mcp_server:main"
simple-memory-web = "simple_memory.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_memory"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
