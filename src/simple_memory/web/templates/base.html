<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Simple Memory{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">Simple Memory</a>
        </div>
        <div class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">首页</a>
            <a href="/memories" class="{% if request.path == '/memories' %}active{% endif %}">记忆库</a>
            <a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">设置</a>
        </div>
        <div class="nav-status">
            {% if config.is_configured() %}
            <span class="status-badge status-ok">已配置</span>
            {% else %}
            <span class="status-badge status-error">未配置</span>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Simple Memory - 基于 LanceDB 的记忆仓库 MCP</p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
