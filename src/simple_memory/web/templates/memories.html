{% extends "base.html" %}

{% block title %}记忆库 - Simple Memory{% endblock %}

{% block content %}
<div class="page-header">
    <h1>记忆库</h1>
    <p class="subtitle">查看和管理所有存储的记忆</p>
</div>

{% if not config.is_configured() %}
<div class="alert alert-warning">
    <h3>⚠️ 系统未配置</h3>
    <p>请先前往 <a href="/settings">设置页面</a> 配置 LLM 和嵌入模型。</p>
</div>
{% else %}

<div class="memories-toolbar">
    <div class="search-filter">
        <input type="text" id="filter-input" placeholder="搜索记忆内容...">
        <select id="tag-filter">
            <option value="">所有标签</option>
        </select>
        <select id="search-mode">
            <option value="local">本地筛选</option>
            <option value="semantic">语义搜索</option>
        </select>
        <button id="search-filter-btn">搜索</button>
    </div>
    <div class="toolbar-actions">
        <button id="refresh-btn" class="btn-secondary">刷新</button>
    </div>
</div>

<div class="memories-container">
    <div id="memories-list" class="memories-list">
        <div class="loading">加载中...</div>
    </div>
</div>

<div id="memory-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>记忆详情</h2>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body" id="memory-detail">
        </div>
        <div class="modal-footer">
            <button id="delete-memory-btn" class="btn-danger">删除记忆</button>
            <button class="modal-close-btn">关闭</button>
        </div>
    </div>
</div>

<script>
let allMemories = [];
let allTags = [];
let currentMemoryId = null;
let isSemanticSearchResult = false;

// Helper function to get similarity class based on score
function getSimilarityClass(similarity) {
    if (similarity >= 70) return 'similarity-high';
    if (similarity >= 50) return 'similarity-medium';
    return 'similarity-low';
}

document.addEventListener('DOMContentLoaded', function() {
    loadMemories();
    loadTags();

    // Event listeners
    document.getElementById('refresh-btn').addEventListener('click', loadMemories);
    document.getElementById('search-filter-btn').addEventListener('click', performSearch);
    document.getElementById('filter-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') performSearch();
    });

    // Modal
    const modal = document.getElementById('memory-modal');
    document.querySelectorAll('.modal-close, .modal-close-btn').forEach(btn => {
        btn.addEventListener('click', () => modal.style.display = 'none');
    });
    window.addEventListener('click', (e) => {
        if (e.target === modal) modal.style.display = 'none';
    });

    document.getElementById('delete-memory-btn').addEventListener('click', deleteCurrentMemory);
});

async function loadMemories() {
    const list = document.getElementById('memories-list');
    list.innerHTML = '<div class="loading">加载中...</div>';

    try {
        const response = await fetch('/api/memories');
        const data = await response.json();

        if (data.success) {
            allMemories = data.memories;
            renderMemories(allMemories);
        } else {
            list.innerHTML = `<div class="error">加载失败: ${data.error}</div>`;
        }
    } catch (error) {
        list.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
    }
}

async function loadTags() {
    try {
        const response = await fetch('/api/stats');
        const data = await response.json();

        if (data.success) {
            allTags = data.stats.tags;
            const select = document.getElementById('tag-filter');
            select.innerHTML = '<option value="">所有标签</option>' +
                allTags.map(tag => `<option value="${escapeHtml(tag)}">${escapeHtml(tag)}</option>`).join('');
        }
    } catch (error) {
        console.error('Failed to load tags:', error);
    }
}

function renderMemories(memories, showSimilarity = false) {
    const list = document.getElementById('memories-list');

    if (memories.length === 0) {
        list.innerHTML = '<div class="no-results">暂无记忆</div>';
        return;
    }

    list.innerHTML = memories.map(mem => `
        <div class="memory-card" data-id="${mem.id}">
            <div class="memory-header">
                <span class="memory-id">#${mem.id.substring(0, 8)}</span>
                ${showSimilarity && mem.similarity !== undefined ? `
                    <span class="similarity-badge ${getSimilarityClass(mem.similarity)}">${mem.similarity}% 相似</span>
                    ${mem.rerank_score ? `<span class="rerank-badge">${mem.rerank_score}% 重排</span>` : ''}
                ` : ''}
                <span class="memory-date">${formatDate(mem.created_at)}</span>
            </div>
            <div class="memory-content">
                ${escapeHtml(mem.processed_content || mem.content).substring(0, 200)}${(mem.processed_content || mem.content).length > 200 ? '...' : ''}
            </div>
            <div class="memory-footer">
                <div class="memory-tags">
                    ${(mem.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
                </div>
                <button class="btn-small view-btn" onclick="viewMemory('${mem.id}')">查看详情</button>
            </div>
        </div>
    `).join('');
}

async function performSearch() {
    const query = document.getElementById('filter-input').value.trim();
    const selectedTag = document.getElementById('tag-filter').value;
    const searchMode = document.getElementById('search-mode').value;

    if (searchMode === 'semantic' && query) {
        // Semantic search using API
        await semanticSearch(query, selectedTag);
    } else {
        // Local filtering
        filterMemoriesLocal(query.toLowerCase(), selectedTag);
    }
}

function filterMemoriesLocal(query, selectedTag) {
    let filtered = allMemories;

    if (query) {
        filtered = filtered.filter(mem => {
            const content = (mem.processed_content || mem.content || '').toLowerCase();
            return content.includes(query);
        });
    }

    if (selectedTag) {
        filtered = filtered.filter(mem => {
            return (mem.tags || []).includes(selectedTag);
        });
    }

    isSemanticSearchResult = false;
    renderMemories(filtered, false);
}

async function semanticSearch(query, selectedTag) {
    const list = document.getElementById('memories-list');
    list.innerHTML = '<div class="loading">语义搜索中...</div>';

    try {
        const requestBody = { query, limit: 20 };
        if (selectedTag) {
            requestBody.tags = [selectedTag];
        }

        const response = await fetch('/api/memories/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
        });
        const data = await response.json();

        if (data.success) {
            isSemanticSearchResult = true;
            renderMemories(data.results, true);
        } else {
            list.innerHTML = `<div class="error">搜索失败: ${data.error}</div>`;
        }
    } catch (error) {
        list.innerHTML = `<div class="error">搜索失败: ${error.message}</div>`;
    }
}

async function viewMemory(id) {
    currentMemoryId = id;
    const modal = document.getElementById('memory-modal');
    const detail = document.getElementById('memory-detail');

    detail.innerHTML = '<div class="loading">加载中...</div>';
    modal.style.display = 'flex';

    try {
        const response = await fetch(`/api/memories/${id}`);
        const data = await response.json();

        if (data.success) {
            const mem = data.memory;
            detail.innerHTML = `
                <div class="detail-section">
                    <h3>ID</h3>
                    <p>${mem.id}</p>
                </div>
                <div class="detail-section">
                    <h3>原始内容</h3>
                    <p>${escapeHtml(mem.content)}</p>
                </div>
                <div class="detail-section">
                    <h3>处理后内容</h3>
                    <p>${escapeHtml(mem.processed_content || '无')}</p>
                </div>
                <div class="detail-section">
                    <h3>标签</h3>
                    <p>${(mem.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('') || '无'}</p>
                </div>
                <div class="detail-section">
                    <h3>元数据</h3>
                    <pre>${Object.keys(mem.metadata || {}).length > 0 ? JSON.stringify(mem.metadata, null, 2) : '无'}</pre>
                </div>
                <div class="detail-section">
                    <h3>创建时间</h3>
                    <p>${formatDate(mem.created_at)}</p>
                </div>
                <div class="detail-section">
                    <h3>更新时间</h3>
                    <p>${formatDate(mem.updated_at)}</p>
                </div>
            `;
        } else {
            detail.innerHTML = `<div class="error">加载失败: ${data.error}</div>`;
        }
    } catch (error) {
        detail.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
    }
}

async function deleteCurrentMemory() {
    if (!currentMemoryId) return;

    if (!confirm('确定要删除这条记忆吗？此操作不可撤销。')) return;

    try {
        const response = await fetch(`/api/memories/${currentMemoryId}`, {
            method: 'DELETE'
        });
        const data = await response.json();

        if (data.success) {
            document.getElementById('memory-modal').style.display = 'none';
            loadMemories();
            loadTags();
        } else {
            alert('删除失败: ' + data.error);
        }
    } catch (error) {
        alert('删除失败: ' + error.message);
    }
}
</script>
{% endif %}
{% endblock %}
